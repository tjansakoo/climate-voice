<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เสียงของเรา – Climate Voice Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#13242C; --muted:#54666E; --line:#C6D3D6; --tint:#E1EAE9; --bar:#BFDCD3;
  --c0:#C93A52; --c1:#E8683F; --c2:#EFA03F; --c3:#DDBF4E; --c4:#6FAE9B; --c5:#4A82B3;
  --font-display:'Prompt','IBM Plex Sans Thai',system-ui,'Noto Sans Thai',sans-serif;
  --font-body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E181D; --surface:#16252C; --ink:#E7EFF1; --muted:#9DB0B7; --line:#2C414A; --tint:#1C2E36; --bar:#2F5A4F;
    --c0:#E3586D; --c1:#F07F57; --c2:#F3AE55; --c3:#E8CC66; --c4:#88C4B1; --c5:#6FA3D1;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181D; --surface:#16252C; --ink:#E7EFF1; --muted:#9DB0B7; --line:#2C414A; --tint:#1C2E36; --bar:#2F5A4F;
  --c0:#E3586D; --c1:#F07F57; --c2:#F3AE55; --c3:#E8CC66; --c4:#88C4B1; --c5:#6FA3D1;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 20px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-family:var(--font-display);font-weight:600;font-size:1.05rem}
.status{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;text-align:right}
.status i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c4);display:inline-block}
.status.off i{background:var(--c2)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:14px;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:.92rem;font-weight:500;color:var(--muted);background:transparent;border:1.5px solid transparent;border-radius:99px;padding:5px 14px;cursor:pointer;min-height:38px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.progress{color:var(--muted);font-size:.9rem;margin:0 0 6px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,5.4vw,2rem);line-height:1.4;margin:0 0 8px;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:1.2rem;line-height:1.4;margin:32px 0 10px}
.hint{color:var(--muted);margin:0 0 22px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;text-align:left;background:var(--surface);color:var(--ink);font:inherit;font-weight:500;border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;cursor:pointer;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--tint)}
.opt .sw{flex:none;width:18px;height:18px;border-radius:50%}
.opt .tick{margin-left:auto;font-size:.85rem;font-weight:600}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sent{margin:18px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.meter{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.meter b{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .3s}
.total{font-family:var(--font-display);font-weight:600;font-size:1.05rem;margin:0 0 18px}
.row{padding:14px 0;border-top:1px solid var(--line)}
.row:last-of-type{border-bottom:1px solid var(--line)}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rowlabel{font-weight:500}
.mine{display:inline-block;margin-left:8px;font-size:.8rem;font-weight:600;padding:1px 9px;border-radius:99px;border:1.5px solid var(--ink)}
.rownum{font-family:var(--font-display);font-weight:600;white-space:nowrap}
.rownum small{font-family:var(--font-body);color:var(--muted);font-weight:400;font-size:.85rem;margin-left:4px}
.dots{display:flex;flex-wrap:wrap;gap:var(--gap);margin-top:10px;min-height:var(--d)}
.dot{width:var(--d);height:var(--d);border-radius:50%;background:var(--col)}
.dot.me{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.dot.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.track{position:relative;height:14px;border-radius:7px;background:var(--tint);margin-top:10px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--col)}
.track .tick{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.bench{margin-top:8px;font-size:.82rem;color:var(--muted)}
.bench .bar{display:block;height:4px;background:var(--line);border-radius:4px;position:relative;margin-top:4px}
.bench .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:4px}
.legend{color:var(--muted);font-size:.85rem;margin:14px 0 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.btn{font:inherit;font-weight:500;border-radius:12px;padding:9px 18px;min-height:44px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{border-color:var(--c0);color:var(--c0)}
.btn.danger.sure{background:var(--c0);color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default}
.err{color:var(--c0);font-size:.9rem;margin-top:12px}
.note{color:var(--muted);font-size:.88rem;margin-top:12px}
label.field{display:block;margin:0 0 16px;font-weight:500}
label.field span.help{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:6px}
textarea{min-height:92px;resize:vertical}
.check{display:flex;align-items:flex-start;gap:10px;margin:0 0 14px;cursor:pointer}
.check input{margin-top:6px;width:18px;height:18px;flex:none}
.big{font-family:var(--font-display);font-weight:700;font-size:2.4rem;line-height:1.1}
.stat{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 4px}
.stat div small{display:block;color:var(--muted);font-size:.85rem}
.qitem{padding:14px 0;border-top:1px solid var(--line)}
.qitem:last-of-type{border-bottom:1px solid var(--line)}
.qitem .opts{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:0 8px;border-radius:99px;margin-left:8px;background:var(--c2);color:#13242C;vertical-align:middle}
.tag.off{background:var(--line);color:var(--muted)}
.sess{padding:14px 0;border-top:1px solid var(--line)}
.sess:last-of-type{border-bottom:1px solid var(--line)}
.sesshead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.headline{font-family:var(--font-display);font-weight:500;font-size:1.05rem;line-height:1.5;margin:6px 0 0}
footer{margin-top:40px;color:var(--muted);font-size:.82rem;line-height:1.7}
.centered{padding:56px 0;text-align:center}
.qrcard{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.qrcard h2{margin-top:0}
.qrbox svg{display:block;width:min(240px,100%);height:auto;border-radius:10px}
.qrfull{text-align:center;padding:12px 0}
.qrfull .qrbox svg{width:min(78vw,56vh,520px);margin:18px auto}
.qrurl{word-break:break-all;color:var(--muted)}
.consent{white-space:pre-line;margin:0 0 14px}
.selpanel{padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.sellist{max-height:260px;overflow:auto;padding-right:4px}
.selrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.selrow .check{margin:0;flex:1}
body.board header,body.board footer,body.board nav.tabs{display:none}
body.board{font-size:1.12rem}
body.board .wrap{max-width:1100px;padding-bottom:110px}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
body.board h1{font-size:clamp(1.9rem,4.4vw,3.3rem);line-height:1.35}
body.board .rowlabel{font-size:1.3rem}
body.board .rownum{font-size:1.45rem}
body.board .qrbox svg{width:min(62vh,72vw,460px);margin:12px auto}
.board-nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.live-badge{font-weight:600;color:var(--c0)}
.board-opt{display:flex;align-items:center;gap:16px;padding:12px 20px;border:1.5px solid var(--line);border-radius:14px;font-size:1.35rem;margin-bottom:10px;background:var(--surface)}
.board-opt .sw{flex:none;width:22px;height:22px;border-radius:50%}
svg.cloud{display:block;width:100%;height:auto;margin-top:8px}
svg.cloud text{font-family:var(--font-display);font-weight:600}
svg.cloud text:focus-visible{outline:2px solid var(--ink)}
.xwrap{margin-top:22px}
.xscroll{overflow-x:auto;margin-top:6px}
table.xt{border-collapse:collapse;width:100%;min-width:420px;font-size:.9rem}
.xt th,.xt td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.xt th:first-child,.xt td.xl{text-align:left;white-space:normal;min-width:160px}
.xt th{font-weight:600;vertical-align:bottom}
.xt th small{display:block;font-weight:400;color:var(--muted)}
.xt td{background:linear-gradient(to right,var(--bar) var(--p,0%),transparent var(--p,0%))}
.xt td.xl{background:none}
.tlist{margin:0;padding-left:1.2em;max-height:340px;overflow:auto}
.tlist li{margin:0 0 8px;overflow-wrap:anywhere}
details{margin-top:10px}
summary{cursor:pointer;font-weight:500}
.opt:disabled{opacity:.45;cursor:default}
.opt:disabled:hover{border-color:var(--line)}
@media (prefers-reduced-motion:reduce){.dot.pop{animation:none}.opt,.meter b{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">เสียงของเรา</div>
    <div class="status off" id="status" role="status"><i></i><span>กำลังเชื่อมต่อ</span></div>
  </header>
  <nav class="tabs" id="nav" hidden aria-label="เมนูผู้ดำเนินกิจกรรม"></nav>
  <main id="app"></main>
  <footer>
    คำถามปรับจาก The Peoples’ Climate Vote 2024 โดยโครงการพัฒนาแห่งสหประชาชาติ (UNDP)<br>
    คำตอบไม่ระบุตัวตน ผู้ดำเนินกิจกรรมเห็นเฉพาะผลรวม
    <div id="foot-actions" style="margin-top:10px"></div>
  </footer>
</div>

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'on') for (const ev in v) e.addEventListener(ev, v[ev]);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}

/* นับผลของคำถามหนึ่งข้อ: counts ต่อตัวเลือก, total = จำนวนคนที่ตอบ (multi เลือกหลายข้อได้ จึงรวม counts เกิน total ได้) */
function tally(q){
  const n = q.options.length, c = new Array(n).fill(0); let total = 0, withText = 0;
  cohort().forEach(v => {
    const x = v.answers && v.answers[q.id]; if (x == null) return;
    if (q.type === 'text'){ if (x === 1 || x === 0){ total++; if (x === 1) withText++; } }
    else if (q.type === 'multi'){ const set = new Set(arr(x).filter(i => Number.isInteger(i) && i >= 0 && i < n)); if (set.size){ total++; set.forEach(i => c[i]++); } }
    else if (Number.isInteger(x) && x >= 0 && x < n){ c[x]++; total++; }
  });
  return { counts:c, total, withText };
}

const STOP = new Set(('และ หรือ ที่ ของ ใน การ ความ ให้ ไป มา มี เป็น ได้ จะ ก็ ไม่ แต่ ว่า ด้วย กับ นี้ นั้น จาก โดย เพื่อ ควร ต้อง คือ แล้ว ยัง อีก เรา ผม ฉัน คุณ เขา ซึ่ง เมื่อ ถ้า แค่ อะไร อย่าง หลาย ทุก บาง ขึ้น ลง ค่ะ คะ ครับ นะ เลย หน่อย อยาก ๆ ' +
  'the and of to a in is for on it we are be with that this').split(' '));
function segWords(text){
  const t = String(text).toLowerCase();
  try {
    if (typeof Intl !== 'undefined' && Intl.Segmenter){
      return [...new Intl.Segmenter('th', { granularity:'word' }).segment(t)].filter(x => x.isWordLike).map(x => x.segment);
    }
  } catch (e) {}
  return t.split(/[\s,.;:!?()\[\]{}"'“”‘’\/\\-]+/).filter(Boolean);
}
function cloudWords(texts, qid){
  const hide = (S.ui.hide && S.ui.hide[qid]) || new Set(), cnt = new Map();
  texts.forEach(t => {
    const seen = new Set();
    segWords(t).forEach(w => {
      if (w.length < 2 || /^[0-9.,]+$/.test(w) || STOP.has(w) || hide.has(w) || seen.has(w)) return;
      seen.add(w); cnt.set(w, (cnt.get(w) || 0) + 1);
    });
  });
  return [...cnt.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'th')).slice(0, 60);
}
function layoutCloud(words, W, H){
  let ctx = null; try { ctx = document.createElement('canvas').getContext('2d'); } catch (e) {}
  const measure = (w, size) => { if (ctx){ ctx.font = '600 ' + size + 'px Prompt, "IBM Plex Sans Thai", sans-serif'; return ctx.measureText(w).width; } return w.length * size * 0.58; };
  const cs = words.map(x => x[1]), max = Math.max.apply(null, cs), min = Math.min.apply(null, cs), placed = [], out = [];
  words.forEach(([w, c], idx) => {
    const t = max === min ? 0.6 : (Math.sqrt(c) - Math.sqrt(min)) / (Math.sqrt(max) - Math.sqrt(min));
    let size = Math.round(15 + t * 40);
    for (let attempt = 0; attempt < 4 && size >= 11; attempt++){
      const tw = measure(w, size) + 10, th = size * 1.3; let a = idx * 0.9, r = 0, pos = null;
      for (let k = 0; k < 2500; k++){
        const x = W / 2 + r * Math.cos(a) * 1.7 - tw / 2, y = H / 2 + r * Math.sin(a) - th / 2;
        if (x >= 0 && y >= 0 && x + tw <= W && y + th <= H && !placed.some(q => x < q.x + q.w && x + tw > q.x && y < q.y + q.h && y + th > q.y)){ pos = { x, y }; break; }
        a += 0.25; r += 0.35;
      }
      if (pos){ placed.push({ x:pos.x, y:pos.y, w:tw, h:th }); out.push({ w, c, size, x:pos.x + 5, y:pos.y + size, i:idx }); break; }
      size = Math.round(size * 0.8);
    }
  });
  return out;
}
function cloudSvg(words, o){
  o = o || {};
  const W = 700, H = 380, NS = 'http://www.w3.org/2000/svg', pal = [0, 1, 4, 5];
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'cloud'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Word cloud คำที่พูดถึงบ่อย: ' + words.slice(0, 8).map(x => x[0]).join(', '));
  layoutCloud(words, W, H).forEach(p => {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', p.x); t.setAttribute('y', p.y); t.setAttribute('font-size', p.size); t.setAttribute('fill', 'var(--c' + pal[p.i % 4] + ')');
    t.textContent = p.w;
    const ti = document.createElementNS(NS, 'title'); ti.textContent = p.w + ' (' + p.c + ' ความเห็น)'; t.append(ti);
    if (o.onClick){
      t.style.cursor = 'pointer'; t.setAttribute('tabindex', '0'); t.setAttribute('role', 'button');
      t.addEventListener('click', () => o.onClick(p.w));
      t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); o.onClick(p.w); } });
    }

}

/* ================= ส่วนแสดงผลลัพธ์ ================= */
function benchLine(q, i){
  if (!q.benchmark || typeof q.benchmark[i] !== 'number') return null;
  return h('div', { class:'bench' }, 'ทั่วโลก ' + q.benchmark[i] + '%', h('span', { class:'bar' }, h('b', { style:'width:' + Math.min(100, q.benchmark[i]) + '%' })));
}
function resultBlock(q, counts, o){
  o = o || {};
  const total = o.total != null ? o.total : counts.reduce((a, b) => a + b, 0);
  const isMine = i => Array.isArray(o.mine) ? o.mine.includes(i) : o.mine === i;
  const frag = document.createDocumentFragment();
  const per = total > 300 ? Math.ceil(total / 300) : 1;
  const d = Math.round((total <= 40 ? 16 : total <= 150 ? 10 : 7) * (o.scale || 1)), gap = d <= 7 ? 3 : 5;
  q.options.forEach((opt, i) => {
    const pct = total ? Math.round(100 * counts[i] / total) : 0;
    const lab = h('span', { class:'rowlabel' }, opt.label, isMine(i) ? h('span', { class:'mine' }, 'คุณ') : null);
    const head = h('div', { class:'rowhead' }, lab, h('span', { class:'rownum' }, pct + '%', h('small', null, counts[i] + ' คน')));
    const row = h('div', { class:'row' }, head);
    if (o.kind === 'bars'){
      const t = h('div', { class:'track', style:'--col:var(--c' + opt.heat + ')' }, h('span', { class:'fill', style:'width:' + pct + '%' }));
      if (q.benchmark && typeof q.benchmark[i] === 'number') t.append(h('span', { class:'tick', style:'left:' + Math.min(100, q.benchmark[i]) + '%' }));
      row.append(t);
      if (q.benchmark && typeof q.benchmark[i] === 'number') row.append(h('div', { class:'bench' }, 'เส้นดำ = ทั่วโลก ' + q.benchmark[i] + '%'));
    } else {
      const dots = h('div', { class:'dots', style:'--d:' + d + 'px;--gap:' + gap + 'px' });
      const n = Math.ceil(counts[i] / per), key = (o.key || q.id) + ':' + i, before = prevDots[key] != null ? prevDots[key] : n;
      for (let k = 0; k < n; k++){
        const dot = h('span', { class:'dot', style:'--col:var(--c' + opt.heat + ')' });
        if (isMine(i) && k === 0) dot.classList.add('me');
        if (k >= before) dot.classList.add('pop');
        dots.append(dot);
      }
      prevDots[key] = n;
      row.append(dots);
      const b = benchLine(q, i); if (b) row.append(b);
    }
    frag.append(row);
  });
  if (per > 1) frag.append(h('p', { class:'legend' }, '1 จุด แทน ' + per + ' คน'));
  if (q.type === 'multi') frag.append(h('p', { class:'legend' }, 'เลือกได้หลายข้อ ร้อยละคิดจากจำนวนผู้ตอบ รวมกันเกิน 100% ได้'));
  return frag;
}

    h('label', { class:'check', style:'margin-top:20px' }, tick, h('span', null, 'ฉันได้อ่านข้อมูลข้างต้นแล้ว และยินยอมเข้าร่วมกิจกรรม')),
    h('div', { class:'actions' }, ok, h('button', { class:'btn', type:'button', on:{ click: () => { S.ui.declined = true; render(); } } }, 'ไม่ยินยอม')));
}
const qHint = q => q.type === 'multi' ? (q.max ? 'เลือกได้สูงสุด ' + q.max + ' ข้อ' : 'เลือกทุกข้อที่ตรงกับคุณ') : q.type === 'text' ? 'พิมพ์ได้ตามสบาย ถ้าไม่มีให้กด “ข้ามข้อนี้”' : 'เลือกข้อที่ตรงกับคุณที่สุด';
const progressLine = (q, i, n) => (q.part ? q.part + ' ' : '') + '(ข้อ ' + (i + 1) + ' จาก ' + n + ')';

function draftOf(q){
  S.ui.draft = S.ui.draft || {};
  const k = S.state.sid + ':' + q.id;
  if (!S.ui.draft[k]){ const m = myAnswer(q.id); S.ui.draft[k] = { sel: q.type === 'multi' ? arr(m).filter(Number.isInteger) : [], other:'', text:'', saved:false }; }
  return S.ui.draft[k];
}
function saveText(key, v){
  if (!S.state || !(S.state.status === 'active' || S.state.status === 'lobby') || !v) return;
  const sid = S.state.sid, text = String(v).slice(0, 1000);
  S.chain = S.chain.then(() => S.db.doc('texts/' + S.uid + '/' + key).set({ sid, v:text })).catch(() => { S.saveErr = true; schedule(); });
}
function toggle(q, i){
  const d = draftOf(q), k = d.sel.indexOf(i);
  if (k >= 0) d.sel.splice(k, 1); else if (!q.max || d.sel.length < q.max) d.sel.push(i);
  render();
}
function submitMulti(q){
  const d = draftOf(q); if (!d.sel.length) return;
  const sel = d.sel.slice().sort((a, b) => a - b), oi = otherIdx(q);
  if (oi >= 0 && sel.includes(oi) && d.other.trim()) saveText(q.id + '_o', d.other.trim());
  answer(q.id, sel);
}
function submitText(q){
  const d = draftOf(q), v = d.text.trim(); if (!v) return;
  saveText(q.id, v); answer(q.id, 1);
}
function saveOther(q){
  const d = draftOf(q), v = d.other.trim(); if (!v) return;
  saveText(q.id + '_o', v); d.saved = true; render();
}

function inputControls(q, mine){
  const d = draftOf(q), oi = otherIdx(q), wrap = document.createDocumentFragment();
  if (q.type === 'text'){
    const send = h('button', { class:'btn primary', type:'button', disabled: !d.text.trim(), on:{ click: () => submitText(q) } }, mine === 1 ? 'อัปเดตความเห็น' : 'ส่งความเห็น');
    const ta = h('textarea', { maxlength:'1000', rows:'5', placeholder:'พิมพ์ความเห็นของคุณที่นี่', 'aria-label':q.text }, d.text);
    ta.addEventListener('input', () => { d.text = ta.value; send.disabled = !d.text.trim(); });
    wrap.append(ta, h('div', { class:'actions' }, send, mine == null ? h('button', { class:'btn', type:'button', on:{ click: () => answer(q.id, 0) } }, 'ข้ามข้อนี้') : null));
    return wrap;
  }
  const multi = q.type === 'multi', list = h('div', { class:'options' });
  q.options.forEach((opt, i) => {
    const pressed = multi ? d.sel.includes(i) : mine === i;
    const blocked = !!(multi && q.max && !pressed && d.sel.length >= q.max);
    list.append(h('button', { class:'opt', type:'button', 'aria-pressed': pressed ? 'true' : 'false', disabled: blocked, on:{ click: () => multi ? toggle(q, i) : answer(q.id, i) } },
      h('span', { class:'sw', style:'background:var(--c' + opt.heat + ')' }), h('span', null, opt.label),
      pressed ? h('span', { class:'tick' }, multi ? 'เลือกแล้ว' : 'คำตอบของคุณ') : null));
  });
  wrap.append(list);
  const otherOn = oi >= 0 && (multi ? d.sel.includes(oi) : mine === oi);
  if (otherOn){
    const inp = h('input', { type:'text', maxlength:'200', placeholder:'โปรดระบุ', 'aria-label':'โปรดระบุ', value:d.other });
    inp.addEventListener('input', () => { d.other = inp.value; d.saved = false; });
    if (!multi) inp.addEventListener('change', () => saveOther(q));
    wrap.append(h('label', { class:'field', style:'margin-top:14px' }, 'โปรดระบุ', inp));
    if (!multi) wrap.append(h('div', { class:'actions', style:'margin-top:0' }, h('button', { class:'btn sm', type:'button', on:{ click: () => saveOther(q) } }, 'บันทึกข้อความ'), d.saved ? h('span', { class:'muted small' }, 'บันทึกแล้ว') : null));
  }
  if (multi){
    wrap.append(h('div', { class:'actions' },
      h('button', { class:'btn primary', type:'button', disabled: !d.sel.length, on:{ click: () => submitMulti(q) } }, mine != null ? 'อัปเดตคำตอบ' : 'ส่งคำตอบ'),
      h('span', { class:'muted small' }, 'เลือกแล้ว ' + d.sel.length + (q.max ? ' จาก ' + q.max : '') + ' ข้อ')));
  }
  return wrap;
}

function lobbyView(st){
  const lq = st.questions.filter(q => q.lobby), online = Math.max(activeIds().size, 1);
  if (!lq.length) return msgView('รอผู้ดำเนินกิจกรรมเริ่ม', 'คุณอยู่ในห้องแล้ว ตอนนี้มีคนออนไลน์ ' + online + ' คน คำถามข้อแรกจะขึ้นเองเมื่อพร้อม');

function participantView(){
  const st = S.state;
  if (st && (st.status === 'lobby' || st.status === 'active') && needConsent(st) && !consented(st)) return consentView(st);
  if (st && st.status === 'lobby') return lobbyView(st);
  if (!st || st.status === 'idle') return msgView('รอผู้ดำเนินกิจกรรมเริ่ม', 'หน้านี้จะเปลี่ยนเป็นคำถามข้อแรกเองเมื่อพร้อม');
  if (st.status === 'ended'){
    const frag = document.createDocumentFragment();
    frag.append(h('h1', null, 'จบกิจกรรมแล้ว'), h('p', { class:'hint' }, 'ขอบคุณที่ร่วมส่งเสียง นี่คือผลของทั้งห้อง'));
    st.questions.forEach((q, qi) => {
      frag.append(h('h2', null, 'ข้อ ' + (qi + 1) + ' ' + q.text));

      else frag.append(resultBlock(q, tl.counts, { mine: myAnswer(q.id), total:tl.total, key:'end-' + st.sid + q.id }));

    const tl = tally(q);
    if (q.type === 'text'){
      frag.append(h('p', { class:'total', 'aria-live':'polite' }, 'มีผู้ร่วมแสดงความเห็น ' + tl.withText + ' คน'), h('p', { class:'hint' }, 'ขอบคุณที่ร่วมแบ่งปันมุมมอง ความเห็นทั้งหมดเป็นแบบไม่ระบุตัวตน'));
    } else {
      frag.append(h('p', { class:'total', 'aria-live':'polite' }, 'ตอบแล้ว ' + tl.total + ' คน'), resultBlock(q, tl.counts, { mine, total:tl.total, key:st.sid + q.id }));
    }
    if (mine == null) frag.append(h('p', { class:'note' }, 'ข้อนี้ปิดรับคำตอบแล้ว'));
  } else {
    frag.append(h('p', { class:'hint' }, qHint(q)));
    frag.append(inputControls(q, mine));
    if (hasAnswer(mine)){
      const online = activeIds().size, ans = answeredActive(q.id), joined = Math.max(online, ans);
      frag.append(h('div', { class:'sent', 'aria-live':'polite' },
        'ส่งคำตอบแล้ว รอเพื่อนๆ ' + ans + ' จาก ' + joined + ' คน ผลจะขึ้นเองเมื่อผู้ดำเนินกิจกรรมเปิดเผย',
        h('div', { class:'meter' }, h('b', { style:'width:' + (joined ? Math.round(100 * ans / joined) : 0) + '%' }))));
      frag.append(h('p', { class:'note' }, q.type === 'single' ? 'แตะข้ออื่นเพื่อเปลี่ยนคำตอบได้จนกว่าผลจะเปิด' : 'แก้ไขแล้วกดอัปเดตได้จนกว่าผลจะเปิด'));
    }
  }
  if (q.type === 'text'){ const pc = publicCloud(q, st); if (pc) frag.append(pc); }
  if (S.saveErr) frag.append(h('p', { class:'err' }, 'บันทึกคำตอบไม่สำเร็จ ลองอีกครั้ง'));
  return frag;
}

function saveMine(){
  S.chain = S.chain.then(() => S.db.doc('votes/' + S.uid).set({ sid:S.mine.sid, answers:Object.assign({}, S.mine.answers), t:Date.now() }))
    .then(() => { if (S.saveErr){ S.saveErr = false; schedule(); } })
    .catch(() => { S.saveErr = true; schedule(); });
}
function answer(qid, i){
  const st = S.state; if (!st) return;
  const q = st.questions.find(x => x.id === qid);
  if (!(st.status === 'active' || (st.status === 'lobby' && q && q.lobby)) || (needConsent(st) && !consented(st))) return;
  if (!S.mine || S.mine.sid !== S.state.sid) S.mine = { sid:S.state.sid, answers:{} };
  S.mine = { sid:S.mine.sid, answers:Object.assign({}, S.mine.answers, { [qid]: i }) };
  S.votes = Object.assign({}, S.votes, { [S.uid]: { sid:S.mine.sid, answers:S.mine.answers } });
  render(); saveMine();
}
function ensureJoined(){
  const st = S.state;
  if (S.board || !S.votesReady || !S.stateReady || !st || !(st.status === 'active' || st.status === 'lobby') || S.joinedSid === st.sid) return;
  if (S.isAdmin && S.tab !== 'participant') return;
  S.joinedSid = st.sid;
  const mv = S.votes[S.uid];
  if (mv && mv.sid === st.sid) S.mine = { sid:st.sid, answers:Object.assign({}, mv.answers) };
  else S.mine = { sid:st.sid, answers:{} };
}

/* ================= แอดมิน: ควบคุมกิจกรรม ================= */
async function adm(fn){
  S.adminErr = '';
  try { await fn(); } catch (e) { S.adminErr = 'ทำรายการไม่สำเร็จ ลองอีกครั้ง'; }
  render();
}
function startSession(title, auto, consent, consentOn){
  const qs = bankQs().filter(q => q.enabled !== false).map(q => ({ id:q.id, type:q.type || 'single', max:q.max || null, part:q.part || null, lobby:!!q.lobby, text:q.text, hint:q.hint || '', options:q.options || [], benchmark:q.benchmark || null }));
  const mains = qs.map((q, i) => q.lobby ? -1 : i).filter(i => i >= 0);
  if (!mains.length){ S.ui.startErr = 'ต้องมีคำถามหลักที่ไม่ใช่ “ถามในห้องรอ” อย่างน้อย 1 ข้อ (แท็บ “คำถาม”)'; render(); return; }
  if (consent && (!consent.body || /\[ใส่/.test(consent.title + consent.body))){ S.ui.startErr = 'แก้ข้อความ “[ใส่…]” ในหน้าขอความยินยอมให้เรียบร้อยก่อนเริ่ม'; render(); return; }
  S.ui.startErr = ''; S.ui.sf = null;
  adm(async () => {
    const cfg = { title:title || 'Workshop', auto:!!auto, consentOn:!!consentOn };
    if (consent){ cfg.consentTitle = consent.title; cfg.consentBody = consent.body; }
    await S.db.doc('live/state').set({ sid:uidNew('s'), status:'lobby', title:title || 'Workshop', questions:qs, cur:mains[0], revealed:{}, board:{ mode:'live' }, auto:!!auto, consent: consent || null });
    try { await S.db.doc('live/bank').update({ settings:cfg }); S.settings = Object.assign({}, S.settings, cfg); } catch (e) {}
  });
}
function buildArchive(){
  const st = S.state;
  const respondents = cohort().filter(v => v.answers && Object.keys(v.answers).length > 0);
  /* ข้อมูลรายคนแบบไม่ระบุตัวตน (ไม่มีรหัสผู้ใช้ ไม่มีข้อความพิมพ์) ไว้ดูผลแยกกลุ่ม */
  const responses = respondents.slice(0, 500).map(v => {
    const o = {};
    st.questions.forEach(q => {
      if (q.type === 'text') return;
      const x = v.answers[q.id];
      if (q.type === 'multi'){ const l = arr(x).filter(Number.isInteger).sort((a, b) => a - b); if (l.length) o[q.id] = l; }
      else if (Number.isInteger(x)) o[q.id] = x;
    });
    return o;
  }).filter(o => Object.keys(o).length);
  return {
    sid:st.sid, title:st.title, startedAt:st.startedAt || null, endedAt:Date.now(), participants:respondents.length,
    consented: needConsent(st) ? Object.values(S.consents).filter(c => c && c.sid === st.sid).length : null,
    consentTitle: needConsent(st) ? st.consent.title || null : null,
    questions: st.questions.map(q => {
      const tl = tally(q), texts = textsFor(q).slice(0, 300);
      return { id:q.id, type:q.type || 'single', max:q.max || null, part:q.part || null, text:q.text, options:q.options, benchmark:q.benchmark || null, counts:tl.counts, total:tl.total, withText:tl.withText, texts };
    }),
    responses
  };
}
function endSession(){
  S.ui.confirmEnd = false;
  adm(async () => {
    const a = buildArchive();
    await S.db.doc('archive/' + a.sid).set(a);
    await S.db.doc('live/state').update({ status:'ended', endedAt:a.endedAt });
  });
}
function checkAuto(){
  const st = S.state;
  if (!S.isAdmin || !st || st.status !== 'active' || !st.auto || S.autoBusy) return;
  const q = st.questions[st.cur]; if (!q || (st.revealed && st.revealed[q.id])) return;
  const online = activeIds().size;
  if (online > 0 && answeredActive(q.id) >= online){
    S.autoBusy = true;
    S.db.doc('live/state').update({ revealed:{ [q.id]:true } }).catch(() => {}).then(() => { S.autoBusy = false; });
  }
}

/* ---------- QR เข้าร่วม ---------- */
function joinUrl(){
  if (S.ui.joinUrl) return S.ui.joinUrl;
  return /^https?:/.test(location.protocol) ? location.origin + location.pathname : location.href;
}
function qrSvg(text){
  const NS = 'http://www.w3.org/2000/svg', m = 4;
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), size = n + 2 * m;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
  svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'QR code สำหรับเข้าร่วมกิจกรรม'); svg.setAttribute('shape-rendering', 'crispEdges');
  const bg = document.createElementNS(NS, 'rect'); bg.setAttribute('width', size); bg.setAttribute('height', size); bg.setAttribute('fill', '#ffffff');
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', '#000000');
  svg.append(bg, p);
  return svg;
}
function qrNode(text){
  try { return qrSvg(text); } catch (e) { return h('p', { class:'err' }, 'สร้าง QR ไม่ได้ ลิงก์ยาวเกินไปหรือว่างอยู่'); }
}
const isLocalUrl = u => /^(https?:\/\/)?(localhost|127\.|0\.0\.0\.0|\[::1\])/i.test(u) || /^file:/i.test(u);
function joinCard(){
  const box = h('div', { class:'qrbox' });
  const warn = h('p', { class:'err small' }, '');
  const input = h('input', { type:'text', id:'join-url', value:joinUrl(), 'aria-label':'ลิงก์สำหรับผู้เข้าร่วม' });
  const draw = () => {
    const u = input.value.trim(); S.ui.joinUrl = u;
    box.replaceChildren(qrNode(u));
    warn.textContent = isLocalUrl(u) ? 'ลิงก์นี้เป็นเครื่องของคุณเอง (localhost) มือถือสแกนแล้วจะเข้าไม่ได้ ใช้ได้เมื่อขึ้นโฮสต์แล้ว หรือเปลี่ยนเป็น IP ของเครื่องที่อยู่ใน Wi-Fi เดียวกัน' : '';
  };
  input.addEventListener('input', draw); draw();
  const copy = h('button', { class:'btn sm', type:'button' }, 'คัดลอกลิงก์');
  copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(input.value.trim()); copy.textContent = 'คัดลอกแล้ว'; } catch (e) { copy.textContent = 'คัดลอกไม่ได้'; } setTimeout(() => { copy.textContent = 'คัดลอกลิงก์'; }, 1600); });
  return h('div', { class:'qrcard' },
    h('h2', null, 'ให้ผู้เข้าร่วมสแกน'),
    box,
    h('label', { class:'field', for:'join-url', style:'margin-top:14px' }, 'ลิงก์สำหรับผู้เข้าร่วม', input),
    warn,
    h('div', { class:'actions', style:'margin-top:8px' },
      h('button', { class:'btn sm', type:'button', on:{ click: () => { S.ui.qrFull = true; render(); } } }, 'แสดง QR เต็มจอสำหรับฉาย'), copy));
}
function qrFullView(){
  const st = S.state, active = st && (st.status === 'active' || st.status === 'lobby');
  return h('div', { class:'qrfull' },
    h('h1', null, 'สแกนเพื่อเข้าร่วม'),

    h('div', { class:'actions', style:'justify-content:center' }, h('button', { class:'btn', type:'button', on:{ click: () => { S.ui.qrFull = false; render(); } } }, 'ปิด')));
}

/* คุมกิจกรรมจริงจากหน้า Broadcast (เฉพาะแอดมิน และไม่ใช่โหมดตามสดอย่างเดียว) */
function ctlGo(d){

function ctlReveal(){
  const st = S.state; if (S.boardLive || !S.isAdmin || !st || st.status !== 'active') return;
  const q = st.questions[st.cur], rev = !!(st.revealed && st.revealed[q.id]);

function boardGo(d){

document.addEventListener('keydown', e => {
  if (!S.board || S.boardLive || !S.state || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
  const next = e.key === 'ArrowRight' || e.key === 'PageDown', prev = e.key === 'ArrowLeft' || e.key === 'PageUp';
  if (next || prev){ e.preventDefault(); if (S.state.status === 'ended') boardGo(next ? 1 : -1); else ctlGo(next ? 1 : -1); }
  else if ((e.key === 'r' || e.key === 'R') && S.state.status === 'active') ctlReveal();
});

function saveFile(name, text, type){

  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function exportSettings(withStats){
  const data = {

const SAFE_ID = /^[A-Za-z0-9_-]{1,40}$/;
const QTYPES = ['single', 'multi', 'text'];
function cleanBench(b, n){ return Array.isArray(b) && b.length === n && b.every(x => typeof x === 'number' && isFinite(x) && x >= 0 && x <= 100) ? b : null; }
function parseImport(text){
  let d; try { d = JSON.parse(text); } catch (e) { throw 'อ่านไฟล์ไม่ได้ ไม่ใช่ JSON ที่ถูกต้อง'; }
  if (!d || d.app !== 'climate-voice' || !Array.isArray(d.questions)) throw 'ไม่ใช่ไฟล์ที่ส่งออกจากแอปนี้';
  let skipped = 0; const ids = new Set(), questions = [];
  d.questions.slice(0, 100).forEach(q => {
    const type = QTYPES.includes(q && q.type) ? q.type : 'single';
    const labels = []; let other = null;
    (Array.isArray(q && q.options) ? q.options : []).forEach(o => {
      const l = String(o && typeof o === 'object' ? o.label : o).trim().slice(0, 120);
      if (!l) return;
      if (o && typeof o === 'object' && o.other === true){ if (!other) other = l; return; }
      if (!labels.includes(l)) labels.push(l);
    });
    const t = String((q && q.text) || '').trim().slice(0, 300);
    const count = labels.length + (other ? 1 : 0);
    if (!t || (type !== 'text' && (count < 2 || labels.length > 8))){ skipped++; return; }
    const dir = ['hot', 'cool', 'flat'].includes(q.dir) ? q.dir : 'hot', heats = heatsFor(count, dir);
    let id = SAFE_ID.test(String(q.id)) ? String(q.id) : uidNew('c'); if (ids.has(id)) id = uidNew('c'); ids.add(id);
    const options = type === 'text' ? [] : labels.map((label, i) => ({ label, heat:heats[i] }));
    if (type !== 'text' && other) options.push({ label:other, heat:heats[labels.length], other:true });
    questions.push({ id, type, max: type === 'multi' && Number.isInteger(q.max) && q.max >= 1 && q.max <= 8 ? q.max : null, part:String(q.part || '').trim().slice(0, 100) || null, lobby:q.lobby === true, text:t, hint:String(q.hint || '').slice(0, 200), dir, enabled:q.enabled !== false, draft:q.draft !== false, benchmark: type === 'text' ? null : cleanBench(q.benchmark, options.length), options });
  });
  const settings = d.settings && typeof d.settings === 'object' ? { title:String(d.settings.title || '').slice(0, 120), auto:d.settings.auto !== false, consentOn:d.settings.consentOn !== false, consentTitle:String(d.settings.consentTitle || '').slice(0, 200), consentBody:String(d.settings.consentBody || '').slice(0, 5000) } : null;
  const archive = [];
  (Array.isArray(d.archive) ? d.archive.slice(0, 500) : []).forEach(a => {
    if (!a || !SAFE_ID.test(String(a.sid)) || !Number.isFinite(a.endedAt) || !Array.isArray(a.questions)){ return; }
    const qs = [];
    a.questions.slice(0, 100).forEach(q => {
      const type = QTYPES.includes(q && q.type) ? q.type : 'single';
      const opts = (Array.isArray(q && q.options) ? q.options : []).map(o => { const x = { label:String(o && o.label != null ? o.label : '').slice(0, 120), heat:Number.isInteger(o && o.heat) && o.heat >= 0 && o.heat <= 5 ? o.heat : 0 }; if (o && o.other === true) x.other = true; return x; });
      const counts = Array.isArray(q && q.counts) ? q.counts.map(c => Number.isFinite(c) && c >= 0 ? Math.floor(c) : 0) : [];
      if (!q || !SAFE_ID.test(String(q.id))) return;
      if (type === 'text' ? opts.length !== 0 : (opts.length < 2 || opts.length > 9 || counts.length !== opts.length)) return;
      const total = Number.isFinite(q.total) && q.total >= 0 ? Math.floor(q.total) : counts.reduce((x, y) => x + y, 0);
      qs.push({ id:String(q.id), type, max:Number.isInteger(q.max) ? q.max : null, part:String(q.part || '').slice(0, 100) || null, text:String(q.text || '').slice(0, 300), options:opts, benchmark:cleanBench(q.benchmark, opts.length), counts, total, withText:Number.isFinite(q.withText) ? Math.floor(q.withText) : 0, texts:(Array.isArray(q.texts) ? q.texts : []).slice(0, 300).map(x => String(x).slice(0, 1000)) });
    });
    const responses = (Array.isArray(a.responses) ? a.responses.slice(0, 500) : []).map(r => {
      if (!r || typeof r !== 'object') return null;
      const o = {};
      Object.keys(r).forEach(k => {
        if (!SAFE_ID.test(k)) return; const v = r[k];
        if (Number.isInteger(v) && v >= 0 && v < 20) o[k] = v;
        else if (Array.isArray(v)){ const l = v.filter(x => Number.isInteger(x) && x >= 0 && x < 20).slice(0, 10); if (l.length) o[k] = l; }
      });
      return Object.keys(o).length ? o : null;
    }).filter(Boolean);
    if (qs.length) archive.push({ responses, sid:String(a.sid), title:String(a.title || '').slice(0, 120), startedAt:Number.isFinite(a.startedAt) ? a.startedAt : null, endedAt:a.endedAt, participants:Number.isFinite(a.participants) ? Math.max(0, Math.floor(a.participants)) : 0, questions:qs });
  });
  if (!questions.length && !archive.length) throw 'ไม่พบคำถามหรือสถิติที่ใช้ได้ในไฟล์นี้';
  return { questions, settings, archive, skipped };
}
function applyImport(mode){

      await S.db.doc('live/bank').update(upd);

}

      if (new Set(labels).size !== labels.length) return fail('มีตัวเลือกซ้ำกัน');
      const heats = heatsFor(labels.length + (otherOn ? 1 : 0), dir.value);

    h('label', { class:'check' }, en, h('span', null, 'ใช้ในกิจกรรมรอบถัดไป')),

function csvFor(list){
  const esc = v => { let s = String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [['session_id','session_title','ended_at','question','option','count','percent','global_percent']];
  list.forEach(a => a.questions.forEach(q => {
    const base = [a.sid, a.title, new Date(a.endedAt).toISOString(), q.text], cs = q.counts || [];
    if (q.type === 'text'){
      rows.push(base.concat(['(จำนวนผู้ส่งความเห็น)', q.withText || 0, '', '']));
      (q.texts || []).forEach(t => rows.push(base.concat(['(ความเห็น) ' + t, 1, '', ''])));
      return;
    }
    const total = q.total != null ? q.total : cs.reduce((x, y) => x + y, 0);
    q.options.forEach((o, i) => rows.push(base.concat([o.label, cs[i] || 0, total ? Math.round(1000 * (cs[i] || 0) / total) / 10 : 0, q.benchmark && typeof q.benchmark[i] === 'number' ? q.benchmark[i] : ''])));
    (q.texts || []).forEach(t => rows.push(base.concat(['(ระบุอื่นๆ) ' + t, 1, '', ''])));
  }));
  return '\uFEFF' + rows.map(r => r.map(esc).join(',')).join('\r\n');
}
async function dlCsv(list, name){
  S.ui.dlMsg = '';
  try {
    const url = URL.createObjectURL(new Blob([csvFor(list)], { type:'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch (e) { S.ui.dlMsg = 'ดาวน์โหลดไม่สำเร็จ'; }
  render();
}
function headline(q, counts, total){
  if (total == null) total = counts.reduce((a, b) => a + b, 0);
  if (!total) return 'ยังไม่มีคำตอบ';
  const top = counts.indexOf(Math.max.apply(null, counts)), pct = Math.round(100 * counts[top] / total), multi = q.type === 'multi';
  let s = (multi ? 'ถูกเลือกมากที่สุด: “' : 'ส่วนใหญ่ตอบว่า “') + q.options[top].label + '” (' + pct + (multi ? '% ของผู้ตอบ)' : '%)');
  if (q.benchmark && typeof q.benchmark[top] === 'number') s += ' เทียบกับทั่วโลก ' + q.benchmark[top] + '%';
  return s;
}
function sameOpts(a, b){ return !!a && !!b && a.length === b.length && a.every((o, i) => o.label === b[i].label); }
function aggregate(list){
  const map = new Map();
  list.forEach(a => a.questions.forEach(q => {
    const cs = q.counts || [];
    let m = map.get(q.id);
    if (!m){ m = { q, counts:new Array(cs.length).fill(0), total:0, withText:0, sessions:0, texts:[], skipped:0 }; map.set(q.id, m); }
    if (sameOpts(m.q.options, q.options) && m.counts.length === cs.length){
      cs.forEach((c, i) => { m.counts[i] += c; });
      m.total += q.total != null ? q.total : cs.reduce((x, y) => x + y, 0);
      m.withText += q.withText || 0; m.sessions++;
      m.texts = m.texts.concat(q.texts || []).slice(0, 1000);
    } else m.skipped++;
  }));
  return [...map.values()];
}
const csvEsc = v => { let t = String(v); if (/^[=+\-@]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
const csvText = rows => '\uFEFF' + rows.map(r => r.map(csvEsc).join(',')).join('\r\n');
function dlText(name, text){
  S.ui.dlMsg = '';
  try { saveFile(name, text, 'text/csv;charset=utf-8'); } catch (e) { S.ui.dlMsg = 'ดาวน์โหลดไม่สำเร็จ'; }
  render();
}
function respondentsCsv(list){
  const cols = [], seen = new Set();
  list.forEach(a => a.questions.forEach(q => { if (q.type !== 'text' && !seen.has(q.id)){ seen.add(q.id); cols.push({ id:q.id, text:q.text }); } }));
  const rows = [['session_id', 'session_title'].concat(cols.map(c => c.text))];
  list.forEach(a => {
    const defs = new Map(a.questions.map(q => [q.id, q]));
    (a.responses || []).forEach(r => rows.push([a.sid, a.title].concat(cols.map(c => {
      const q = defs.get(c.id), v = r[c.id]; if (!q || v == null) return '';
      return (Array.isArray(v) ? v : [v]).map(i => q.options[i] ? q.options[i].label : '').filter(Boolean).join(' | ');
    }))));
  });
  return csvText(rows);
}
function crossCompute(gid, withR){
  const defs = new Map(); withR.forEach(a => a.questions.forEach(q => { if (!defs.has(q.id)) defs.set(q.id, q); }));
  const g = defs.get(gid); if (!g) return null;
  /* รวมเฉพาะกิจกรรมที่ตัวเลือกตรงกับปัจจุบัน กันเลขลำดับตัวเลือกสลับความหมายเมื่อเคยเปลี่ยนการแบ่งกลุ่ม */
  const recs = []; let skipped = 0;
  withR.forEach(a => {
    const aq = new Map(a.questions.map(q => [q.id, q]));
    if (!sameOpts((aq.get(gid) || {}).options, g.options)){ skipped++; return; }
    const okIds = new Set(); aq.forEach((q, id) => { const d = defs.get(id); if (d && sameOpts(q.options, d.options)) okIds.add(id); });
    a.responses.forEach(r => recs.push({ r, okIds }));
  });
  const groups = g.options.map(() => ({ n:0, recs:[] }));
  recs.forEach(x => { const v = x.r[gid]; if (Number.isInteger(v) && groups[v]){ groups[v].n++; groups[v].recs.push(x); } });
  const rows = [];
  defs.forEach(q => {
    if (q.id === gid || q.type === 'text') return;
    rows.push({ q, cells: groups.map(gr => {
      const ans = gr.recs.filter(x => x.okIds.has(q.id) && hasAnswer(x.r[q.id]));
      return { nAns:ans.length, counts:q.options.map((_, k) => ans.filter(x => q.type === 'multi' ? arr(x.r[q.id]).includes(k) : x.r[q.id] === k).length) };
    }) });
  });
  return { g, groups, rows, total:recs.length, skipped };
}

  box.append(h('div', { class:'actions' }, h('button', { class:'btn sm', type:'button', on:{ click: () => {
    const rows = [['group_question', 'group', 'group_n', 'question', 'option', 'answered_n', 'count', 'percent']];
    r.rows.forEach(row => row.q.options.forEach((o, i) => row.cells.forEach((c, gi) => rows.push([r.g.text, r.g.options[gi].label, r.groups[gi].n, row.q.text, o.label, c.nAns, c.counts[i], c.nAns ? Math.round(1000 * c.counts[i] / c.nAns) / 10 : '']))));
    dlText('climate-voice-crosstab.csv', csvText(rows));

  return box;

  f.append(S.anon
    ? h('button', { class:'btn sm', type:'button', on:{ click: () => { S.ui.login = true; render(); } } }, 'เข้าสู่ระบบผู้ดำเนินกิจกรรม')
    : h('button', { class:'btn sm', type:'button', on:{ click: logout } }, 'ออกจากระบบ'));
}
function render(){
  renderStatus(); renderNav(); renderFoot();
  if (S.board && S.mode === 'live'){
    $nav.hidden = true;
    if (!S.isAdmin){ $app.replaceChildren(boardGate()); return; }
    if (S.stateReady && S.votesReady){ $app.replaceChildren(boardView()); return; }
  }
  if (S.ui.qrFull && S.isAdmin && S.mode === 'live'){ $nav.hidden = true; $app.replaceChildren(qrFullView()); return; }
  if (S.ui.login && S.mode === 'live'){ $nav.hidden = true; $app.replaceChildren(loginView()); return; }
  let v;
  if (S.mode === 'loading' || (S.mode === 'live' && !(S.stateReady && S.votesReady && S.consentReady))) v = msgView('กำลังเชื่อมต่อ…');
  else if (S.mode !== 'live') v = S.errMsg === 'setup'
    ? msgView('ยังไม่ได้ตั้งค่า Firebase', 'เปิดไฟล์นี้ด้วยตัวแก้ไขข้อความ แล้วใส่ค่าใน FIREBASE_CONFIG ตอนต้นของสคริปต์ (ขั้นตอนอยู่ใน README)')
    : msgView('เข้าร่วมไม่ได้ในตอนนี้', S.errMsg || 'ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้านี้');
  else if (S.isAdmin && S.tab !== 'participant') v = S.tab === 'live' ? adminLive() : S.tab === 'bank' ? adminBank() : adminStats();
  else v = participantView();
  $app.replaceChildren(v);
}
let timer = null;
function schedule(){
  if (S.ui.login || (S.isAdmin && S.tab === 'bank')) return;
  const a = document.activeElement;
  if (a && $app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox'){ S.pending = true; return; }
  clearTimeout(timer); timer = setTimeout(render, 120);
}
$app.addEventListener('focusout', () => { if (S.pending){ S.pending = false; setTimeout(schedule, 250); } });
function afterData(){ ensureJoined(); updatePresence(); checkAuto(); schedule(); }

/* ================= เชื่อมต่อ Firebase Realtime Database ================= */
const arr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.keys(x).sort((a, b) => a - b).map(k => x[k]) : []);
function normQ(q){
  q = Object.assign({}, q); q.type = QTYPES.includes(q.type) ? q.type : 'single'; q.options = arr(q.options).filter(Boolean);
  if (q.texts) q.texts = arr(q.texts);
  if (q.benchmark) q.benchmark = arr(q.benchmark); else q.benchmark = null;
  if (q.counts) q.counts = arr(q.counts);
  return q;
}
const normState = d => d ? Object.assign({}, d, { questions: arr(d.questions).filter(Boolean).map(normQ), revealed: d.revealed || {}, board: d.board && typeof d.board === 'object' ? d.board : { mode:'live' }, cloud: Object.fromEntries(Object.entries(d.cloud || {}).map(([k, v]) => [k, arr(v).filter(x => x && typeof x.w === 'string').map(x => [x.w, Number(x.c) || 1])])) }) : null;

/* ตัวแปลงให้เรียกใช้รูปแบบเดียวกับโค้ดด้านบน (doc/collection/set/update/onSnapshot) */
function mkDb(rdb){
  const flat = (o, p, out) => { for (const k in o){ const v = o[k]; if (v && typeof v === 'object' && !Array.isArray(v)) flat(v, p + k + '/', out); else out[p + k] = v === undefined ? null : v; } return out; };
  const snapDoc = s => ({ id:s.key, exists:s.exists(), data:() => s.val() === null ? undefined : s.val() });
  const doc = path => ({
    set: d => rdb.ref(path).set(JSON.parse(JSON.stringify(d))),
    update: d => rdb.ref(path).update(flat(JSON.parse(JSON.stringify(d)), '', {})),
    delete: () => rdb.ref(path).remove(),
    onSnapshot: (next, err) => { const r = rdb.ref(path), cb = s => next(snapDoc(s)); r.on('value', cb, err); return () => r.off('value', cb); }
  });
  const coll = (path, ord) => ({
    orderBy: (f, dir) => coll(path, { f, dir }),
    onSnapshot: (next, err) => {
      const r = rdb.ref(path);
      const cb = s => {
        const docs = []; s.forEach(c => { docs.push(snapDoc(c)); });
        if (ord) docs.sort((a, b) => { const x = (a.data() || {})[ord.f], y = (b.data() || {})[ord.f]; return (ord.dir === 'desc' ? -1 : 1) * ((x > y) - (x < y)); });
        next({ docs });
      };
      r.on('value', cb, err); return () => r.off('value', cb);
    }
  });
  return { doc, collection: p => coll(p) };
}

function logout(){ firebase.auth().signOut().then(() => location.reload()); }
function loginView(noCancel){
  const em = h('input', { type:'email', id:'l-email', autocomplete:'username' });
  const pw = h('input', { type:'password', id:'l-pw', autocomplete:'current-password' });
  const err = h('p', { class:'err', 'aria-live':'polite' }, '');
  const go = async () => {
    err.textContent = '';
    try { await firebase.auth().signInWithEmailAndPassword(em.value.trim(), pw.value); location.reload(); }
    catch (e) { err.textContent = 'เข้าสู่ระบบไม่สำเร็จ ตรวจอีเมลและรหัสผ่าน'; }
  };
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  return h('div', null,
    h('h1', null, 'เข้าสู่ระบบผู้ดำเนินกิจกรรม'),
    h('p', { class:'hint' }, 'ใช้อีเมลและรหัสผ่านที่สร้างไว้ใน Firebase เท่านั้น ผู้เข้าร่วมไม่ต้องเข้าสู่ระบบ'),
    h('label', { class:'field', for:'l-email' }, 'อีเมล', em),
    h('label', { class:'field', for:'l-pw' }, 'รหัสผ่าน', pw),
    err,
    h('div', { class:'actions' },
      h('button', { class:'btn primary', type:'button', on:{ click: go } }, 'เข้าสู่ระบบ'),
      noCancel ? null : h('button', { class:'btn', type:'button', on:{ click: () => { S.ui.login = false; render(); } } }, 'ยกเลิก')));
}

function boot(){
  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.databaseURL){ S.mode = 'nodb'; S.errMsg = 'setup'; return; }
  if (typeof firebase === 'undefined'){ S.mode = 'error'; S.errMsg = 'โหลด Firebase ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วรีเฟรช'; return; }
  try { firebase.initializeApp(FIREBASE_CONFIG); } catch (e) { S.mode = 'error'; S.errMsg = 'ค่า FIREBASE_CONFIG ไม่ถูกต้อง'; return; }
  const auth = firebase.auth(), rdb = firebase.database();
  let started = false;
  auth.onAuthStateChanged(async u => {
    if (started) return;
    if (!u){
      try { await auth.signInAnonymously(); }
      catch (e) { S.mode = 'error'; S.errMsg = 'เปิด Anonymous sign-in ใน Firebase Authentication ก่อน'; render(); }
      return;
    }
    started = true;
    S.uid = u.uid; S.anon = u.isAnonymous; S.dl = true;
    const db = S.db = mkDb(rdb); S.rdb = rdb;
    rdb.ref('consents/' + u.uid).once('value').then(x => { S.myConsent = x.val(); }).catch(() => {}).then(() => { S.consentReady = true; render(); });
    if (!u.isAnonymous){
      try { S.isAdmin = (await rdb.ref('admins/' + u.uid).once('value')).val() === true; } catch (e) { S.isAdmin = false; }
    }
    S.mode = 'live';
    const fail = () => { S.mode = 'error'; S.errMsg = 'อ่านข้อมูลไม่ได้ ตรวจกติกา (rules) ของฐานข้อมูล'; render(); };
    db.doc('live/state').onSnapshot(s => { S.state = s.exists ? normState(s.data()) : null; S.stateReady = true; afterData(); }, fail);
    db.collection('votes').onSnapshot(snap => {
      const m = {}; snap.docs.forEach(x => { const d = x.data(); if (d) m[x.id] = Object.assign({}, d, { answers: d.answers || {} }); });
      S.votes = m; S.votesReady = true; afterData();
    }, fail);
    rdb.ref('.info/serverTimeOffset').on('value', x => { S.offset = x.val() || 0; });
    let wasConn = false;
    rdb.ref('.info/connected').on('value', x => { const c = x.val() === true; if (c && !wasConn && P.on){ P.key = null; rdb.ref('presence/' + S.uid).onDisconnect().remove(); updatePresence(); } wasConn = c; });
    db.collection('presence').onSnapshot(snap => {
      const m = {}; snap.docs.forEach(x => { const d = x.data(); if (d) m[x.id] = d; });
      S.presence = m; schedule();
    }, () => {});
    setInterval(() => { if (S.mode === 'live'){ checkAuto(); schedule(); } }, 10000);
    if (S.isAdmin){
      db.doc('live/bank').onSnapshot(s => {
        const d = s.exists ? s.data() : null;
        S.bank = d && d.questions ? arr(d.questions).filter(Boolean).map(normQ) : null;
        S.settings = d && d.settings && typeof d.settings === 'object' ? d.settings : null;
        if (!(S.tab === 'bank' && S.ui.editId)){ if (S.tab === 'bank') render(); else schedule(); }
      }, () => {});
      db.collection('consents').onSnapshot(snap => {
        const m = {}; snap.docs.forEach(x => { const d = x.data(); if (d) m[x.id] = d; });
        S.consents = m; schedule();
      }, () => {});
      db.collection('texts').onSnapshot(snap => {
        const m = {}; snap.docs.forEach(x => { const d = x.data(); if (d) m[x.id] = d; });
        S.texts = m; schedule();
      }, () => {});
      db.collection('archive').orderBy('endedAt', 'desc').onSnapshot(snap => {
        S.archive = snap.docs.map(x => x.data()).filter(Boolean).map(a => Object.assign({}, a, { questions: arr(a.questions).filter(Boolean).map(normQ).map(q => Object.assign(q, { counts: q.counts || [], texts: q.texts || [] })), responses: arr(a.responses).filter(Boolean) }));
        S.archiveReady = true; if (S.tab === 'stats') schedule();
      }, () => { S.archiveReady = true; });
    }
    render();
  });
}
boot();
render();
</script>
