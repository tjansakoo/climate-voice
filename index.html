<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เสียงของเรา – Climate Voice Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#13242C; --muted:#54666E; --line:#C6D3D6; --tint:#E1EAE9;
  --c0:#C93A52; --c1:#E8683F; --c2:#EFA03F; --c3:#DDBF4E; --c4:#6FAE9B; --c5:#4A82B3;
  --font-display:'Prompt','IBM Plex Sans Thai',system-ui,'Noto Sans Thai',sans-serif;
  --font-body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E181D; --surface:#16252C; --ink:#E7EFF1; --muted:#9DB0B7; --line:#2C414A; --tint:#1C2E36;
    --c0:#E3586D; --c1:#F07F57; --c2:#F3AE55; --c3:#E8CC66; --c4:#88C4B1; --c5:#6FA3D1;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181D; --surface:#16252C; --ink:#E7EFF1; --muted:#9DB0B7; --line:#2C414A; --tint:#1C2E36;
  --c0:#E3586D; --c1:#F07F57; --c2:#F3AE55; --c3:#E8CC66; --c4:#88C4B1; --c5:#6FA3D1;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 20px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-family:var(--font-display);font-weight:600;font-size:1.05rem}
.status{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;text-align:right}
.status i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c4);display:inline-block}
.status.off i{background:var(--c2)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:14px;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:.92rem;font-weight:500;color:var(--muted);background:transparent;border:1.5px solid transparent;border-radius:99px;padding:5px 14px;cursor:pointer;min-height:38px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.progress{color:var(--muted);font-size:.9rem;margin:0 0 6px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,5.4vw,2rem);line-height:1.4;margin:0 0 8px;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:1.2rem;line-height:1.4;margin:32px 0 10px}
.hint{color:var(--muted);margin:0 0 22px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;text-align:left;background:var(--surface);color:var(--ink);font:inherit;font-weight:500;border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;cursor:pointer;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--tint)}
.opt .sw{flex:none;width:18px;height:18px;border-radius:50%}
.opt .tick{margin-left:auto;font-size:.85rem;font-weight:600}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sent{margin:18px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.meter{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.meter b{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .3s}
.total{font-family:var(--font-display);font-weight:600;font-size:1.05rem;margin:0 0 18px}
.row{padding:14px 0;border-top:1px solid var(--line)}
.row:last-of-type{border-bottom:1px solid var(--line)}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rowlabel{font-weight:500}
.mine{display:inline-block;margin-left:8px;font-size:.8rem;font-weight:600;padding:1px 9px;border-radius:99px;border:1.5px solid var(--ink)}
.rownum{font-family:var(--font-display);font-weight:600;white-space:nowrap}
.rownum small{font-family:var(--font-body);color:var(--muted);font-weight:400;font-size:.85rem;margin-left:4px}
.dots{display:flex;flex-wrap:wrap;gap:var(--gap);margin-top:10px;min-height:var(--d)}
.dot{width:var(--d);height:var(--d);border-radius:50%;background:var(--col)}
.dot.me{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.dot.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.track{position:relative;height:14px;border-radius:7px;background:var(--tint);margin-top:10px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--col)}
.track .tick{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.bench{margin-top:8px;font-size:.82rem;color:var(--muted)}
.bench .bar{display:block;height:4px;background:var(--line);border-radius:4px;position:relative;margin-top:4px}
.bench .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:4px}
.legend{color:var(--muted);font-size:.85rem;margin:14px 0 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.btn{font:inherit;font-weight:500;border-radius:12px;padding:9px 18px;min-height:44px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{border-color:var(--c0);color:var(--c0)}
.btn.danger.sure{background:var(--c0);color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default}
.err{color:var(--c0);font-size:.9rem;margin-top:12px}
.note{color:var(--muted);font-size:.88rem;margin-top:12px}
label.field{display:block;margin:0 0 16px;font-weight:500}
label.field span.help{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:6px}
textarea{min-height:92px;resize:vertical}
.check{display:flex;align-items:flex-start;gap:10px;margin:0 0 14px;cursor:pointer}
.check input{margin-top:6px;width:18px;height:18px;flex:none}
.big{font-family:var(--font-display);font-weight:700;font-size:2.4rem;line-height:1.1}
.stat{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 4px}
.stat div small{display:block;color:var(--muted);font-size:.85rem}
.qitem{padding:14px 0;border-top:1px solid var(--line)}
.qitem:last-of-type{border-bottom:1px solid var(--line)}
.qitem .opts{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:0 8px;border-radius:99px;margin-left:8px;background:var(--c2);color:#13242C;vertical-align:middle}
.tag.off{background:var(--line);color:var(--muted)}
.sess{padding:14px 0;border-top:1px solid var(--line)}
.sess:last-of-type{border-bottom:1px solid var(--line)}
.sesshead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.headline{font-family:var(--font-display);font-weight:500;font-size:1.05rem;line-height:1.5;margin:6px 0 0}
footer{margin-top:40px;color:var(--muted);font-size:.82rem;line-height:1.7}
.centered{padding:56px 0;text-align:center}
.qrcard{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.qrcard h2{margin-top:0}
.qrbox svg{display:block;width:min(240px,100%);height:auto;border-radius:10px}
.qrfull{text-align:center;padding:12px 0}
.qrfull .qrbox svg{width:min(78vw,56vh,520px);margin:18px auto}
.qrurl{word-break:break-all;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.dot.pop{animation:none}.opt,.meter b{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">เสียงของเรา</div>
    <div class="status off" id="status" role="status"><i></i><span>กำลังเชื่อมต่อ</span></div>
  </header>
  <nav class="tabs" id="nav" hidden aria-label="เมนูผู้ดำเนินกิจกรรม"></nav>
  <main id="app"></main>
  <footer>
    คำถามปรับจาก The Peoples’ Climate Vote 2024 โดยโครงการพัฒนาแห่งสหประชาชาติ (UNDP)<br>
    คำตอบไม่ระบุตัวตน ผู้ดำเนินกิจกรรมเห็นเฉพาะผลรวม
    <div id="foot-actions" style="margin-top:10px"></div>
  </footer>
</div>

const FIREBASE_CONFIG = {

/* ================= ชุดคำถามเริ่มต้น (ร่าง) =================
   ใช้เมื่อยังไม่เคยบันทึกคลังคำถาม ผู้ดำเนินกิจกรรมแก้ไขได้ในแท็บ “คำถาม”
   draft = ยังไม่ได้ตรวจถ้อยคำเทียบกับแบบสอบถามทางการของ UNDP */
const heatsFor = (n, dir) => Array.from({length:n}, (_, i) => { const t = n === 1 ? 0 : Math.round(i * 5 / (n - 1)); return dir === 'cool' ? 5 - t : t; });
const mkQ = (id, text, labels, extra) => Object.assign({
  id, text, hint: 'เลือกข้อที่ตรงกับคุณที่สุด', dir: 'hot', enabled: true, draft: true, benchmark: null,
  options: labels.map((label, i) => ({ label, heat: heatsFor(labels.length, (extra && extra.dir) || 'hot')[i] }))
}, extra || {});
const DEFAULTS = [
  mkQ('q1', 'คุณคิดถึงเรื่องการเปลี่ยนแปลงสภาพภูมิอากาศบ่อยแค่ไหน?',
      ['ทุกวัน','มากกว่าสัปดาห์ละครั้ง','สัปดาห์ละครั้ง','เดือนละครั้ง','น้อยกว่าเดือนละครั้ง','ไม่เคยคิดถึงเลย']),
  mkQ('q2', 'เมื่อเทียบกับตอนนี้ คุณอยากให้ประเทศของคุณทำเรื่องสภาพภูมิอากาศอย่างไร?',
      ['ทำมากกว่านี้มาก','ทำมากกว่านี้เล็กน้อย','ทำเท่าเดิม','ทำน้อยลง']),
  mkQ('q3', 'ควรเปลี่ยนจากเชื้อเพลิงฟอสซิล (ถ่านหิน น้ำมัน ก๊าซ) ไปใช้พลังงานสะอาดเร็วแค่ไหน?',
      ['เปลี่ยนอย่างรวดเร็ว','เปลี่ยนอย่างค่อยเป็นค่อยไป','ไม่ควรเปลี่ยน'])
];

/* ================= state ================= */
const $app = document.getElementById('app'), $nav = document.getElementById('nav'), $status = document.getElementById('status');
const S = {
  db: null, dl: null, uid: null, isAdmin: false, mode: 'loading',   // loading | live | nodb | error
  state: null, stateReady: false, votes: {}, votesReady: false,
  bank: null, archive: [], archiveReady: false,
  tab: 'live', ui: {}, mine: null, joinedSid: null, saveErr: false, adminErr: '',
  chain: Promise.resolve(), autoBusy: false
};
const prevDots = {};
S.presence = {}; S.offset = 0;
const P = { on:false, key:null, timer:null };

/* ---------- presence: นับเฉพาะคนที่เปิดหน้านี้และอยู่หน้าจอ ---------- */
function activeIds(){
  const st = S.state, a = new Set(); if (!st) return a;
  const now = Date.now() + (S.offset || 0);
  Object.keys(S.presence).forEach(id => { const p = S.presence[id]; if (p && p.sid === st.sid && p.v === true && typeof p.t === 'number' && now - p.t < 50000) a.add(id); });
  return a;
}
function answeredActive(qid){
  let n = 0; activeIds().forEach(id => { const v = S.votes[id]; if (v && v.sid === (S.state && S.state.sid) && v.answers && Number.isInteger(v.answers[qid])) n++; });
  return n;
}
function pushPresence(){
  if (!S.rdb || !S.state) return;
  S.rdb.ref('presence/' + S.uid).set({ sid:S.state.sid, v:document.visibilityState === 'visible', t:firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
}
function updatePresence(){
  if (!S.rdb || !S.uid) return;
  const st = S.state;
  const want = S.mode === 'live' && st && (st.status === 'active' || st.status === 'lobby') && (!S.isAdmin || S.tab === 'participant');
  const ref = S.rdb.ref('presence/' + S.uid);
  if (!want){
    if (P.on){ P.on = false; P.key = null; clearInterval(P.timer); ref.onDisconnect().cancel(); ref.remove().catch(() => {}); }
    return;
  }
  if (!P.on){ P.on = true; ref.onDisconnect().remove(); P.timer = setInterval(() => { if (P.on) pushPresence(); }, 15000); }
  const key = st.sid + ':' + (document.visibilityState === 'visible');
  if (P.key !== key){ P.key = key; pushPresence(); }
}
document.addEventListener('visibilitychange', updatePresence);

/* ================= helpers ================= */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'on') for (const ev in v) e.addEventListener(ev, v[ev]);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const fmtDate = ms => ms ? new Date(ms).toLocaleString('th-TH', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
const uidNew = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const clone = o => JSON.parse(JSON.stringify(o));
const bankQs = () => S.bank || clone(DEFAULTS);

function cohort(){ const sid = S.state && S.state.sid; return Object.values(S.votes).filter(v => v && v.sid === sid); }
function countsFor(qid, n){
  const c = new Array(n).fill(0);
  cohort().forEach(v => { const x = v.answers && v.answers[qid]; if (Number.isInteger(x) && x >= 0 && x < n) c[x]++; });
  return c;
}
const answeredCount = qid => cohort().filter(v => v.answers && Number.isInteger(v.answers[qid])).length;
const myAnswer = qid => (S.mine && S.state && S.mine.sid === S.state.sid && S.mine.answers) ? S.mine.answers[qid] : undefined;

/* ================= ส่วนแสดงผลลัพธ์ ================= */
function benchLine(q, i){
  if (!q.benchmark || typeof q.benchmark[i] !== 'number') return null;
  return h('div', { class:'bench' }, 'ทั่วโลก ' + q.benchmark[i] + '%', h('span', { class:'bar' }, h('b', { style:'width:' + Math.min(100, q.benchmark[i]) + '%' })));
}
function resultBlock(q, counts, o){
  o = o || {};
  const total = counts.reduce((a, b) => a + b, 0);
  const frag = document.createDocumentFragment();
  const per = total > 300 ? Math.ceil(total / 300) : 1;
  const d = total <= 40 ? 16 : total <= 150 ? 10 : 7, gap = d <= 7 ? 3 : 5;
  q.options.forEach((opt, i) => {
    const pct = total ? Math.round(100 * counts[i] / total) : 0;
    const lab = h('span', { class:'rowlabel' }, opt.label, o.mine === i ? h('span', { class:'mine' }, 'คุณ') : null);
    const head = h('div', { class:'rowhead' }, lab, h('span', { class:'rownum' }, pct + '%', h('small', null, counts[i] + ' คน')));
    const row = h('div', { class:'row' }, head);
    if (o.kind === 'bars'){
      const t = h('div', { class:'track', style:'--col:var(--c' + opt.heat + ')' }, h('span', { class:'fill', style:'width:' + pct + '%' }));
      if (q.benchmark && typeof q.benchmark[i] === 'number') t.append(h('span', { class:'tick', style:'left:' + Math.min(100, q.benchmark[i]) + '%' }));
      row.append(t);
      if (q.benchmark && typeof q.benchmark[i] === 'number') row.append(h('div', { class:'bench' }, 'เส้นดำ = ทั่วโลก ' + q.benchmark[i] + '%'));
    } else {
      const dots = h('div', { class:'dots', style:'--d:' + d + 'px;--gap:' + gap + 'px' });
      const n = Math.ceil(counts[i] / per), key = (o.key || q.id) + ':' + i, before = prevDots[key] != null ? prevDots[key] : n;
      for (let k = 0; k < n; k++){
        const dot = h('span', { class:'dot', style:'--col:var(--c' + opt.heat + ')' });
        if (o.mine === i && k === 0) dot.classList.add('me');
        if (k >= before) dot.classList.add('pop');
        dots.append(dot);
      }
      prevDots[key] = n;
      row.append(dots);
      const b = benchLine(q, i); if (b) row.append(b);
    }
    frag.append(row);
  });
  if (per > 1) frag.append(h('p', { class:'legend' }, '1 จุด แทน ' + per + ' คน'));
  return frag;
}

/* ================= มุมมองผู้เข้าร่วม ================= */
function msgView(title, sub){ return h('div', { class:'centered' }, h('h1', null, title), sub ? h('p', { class:'hint' }, sub) : null); }

function participantView(){
  const st = S.state;
  if (st && st.status === 'lobby'){
    const online = activeIds().size;
    return msgView('รอผู้ดำเนินกิจกรรมเริ่ม', 'คุณอยู่ในห้องแล้ว ตอนนี้มีคนออนไลน์ ' + Math.max(online, 1) + ' คน คำถามข้อแรกจะขึ้นเองเมื่อพร้อม');
  }
  if (!st || st.status === 'idle') return msgView('รอผู้ดำเนินกิจกรรมเริ่ม', 'หน้านี้จะเปลี่ยนเป็นคำถามข้อแรกเองเมื่อพร้อม');
  if (st.status === 'ended'){
    const frag = document.createDocumentFragment();
    frag.append(h('h1', null, 'จบกิจกรรมแล้ว'), h('p', { class:'hint' }, 'ขอบคุณที่ร่วมส่งเสียง นี่คือผลของทั้งห้อง'));
    st.questions.forEach((q, qi) => {
      frag.append(h('h2', null, 'ข้อ ' + (qi + 1) + ' ' + q.text));
      frag.append(resultBlock(q, countsFor(q.id, q.options.length), { mine: myAnswer(q.id), key:'end-' + st.sid + q.id }));
    });
    return frag;
  }
  const q = st.questions[st.cur], n = q.options.length;
  const revealed = !!(st.revealed && st.revealed[q.id]);
  const frag = document.createDocumentFragment();
  frag.append(h('p', { class:'progress' }, 'ข้อ ' + (st.cur + 1) + ' จาก ' + st.questions.length), h('h1', null, q.text));
  const mine = myAnswer(q.id);
  if (revealed){
    const counts = countsFor(q.id, n), total = counts.reduce((a, b) => a + b, 0);
    const t = h('p', { class:'total', 'aria-live':'polite' }, 'ตอบแล้ว ' + total + ' คน');
    frag.append(t, resultBlock(q, counts, { mine, key:st.sid + q.id }));
    if (mine == null) frag.append(h('p', { class:'note' }, 'ข้อนี้ปิดรับคำตอบแล้ว'));
  } else {
    frag.append(h('p', { class:'hint' }, q.hint || ''));
    const list = h('div', { class:'options' });
    q.options.forEach((opt, i) => {
      list.append(h('button', { class:'opt', type:'button', 'aria-pressed': mine === i ? 'true' : 'false', on:{ click: () => answer(q.id, i) } },
        h('span', { class:'sw', style:'background:var(--c' + opt.heat + ')' }), h('span', null, opt.label),
        mine === i ? h('span', { class:'tick' }, 'คำตอบของคุณ') : null));
    });
    frag.append(list);
    if (mine != null){
      const online = activeIds().size, ans = answeredActive(q.id), joined = Math.max(online, ans);
      frag.append(h('div', { class:'sent', 'aria-live':'polite' },
        'ส่งคำตอบแล้ว รอเพื่อนๆ ' + ans + ' จาก ' + joined + ' คน ผลจะขึ้นเองเมื่อผู้ดำเนินกิจกรรมเปิดเผย',
        h('div', { class:'meter' }, h('b', { style:'width:' + (joined ? Math.round(100 * ans / joined) : 0) + '%' }))));
      frag.append(h('p', { class:'note' }, 'แตะข้ออื่นเพื่อเปลี่ยนคำตอบได้จนกว่าผลจะเปิด'));
    }
  }
  if (S.saveErr) frag.append(h('p', { class:'err' }, 'บันทึกคำตอบไม่สำเร็จ ลองแตะเลือกอีกครั้ง'));
  return frag;
}

function saveMine(){
  S.chain = S.chain.then(() => S.db.doc('votes/' + S.uid).set({ sid:S.mine.sid, answers:Object.assign({}, S.mine.answers), t:Date.now() }))
    .then(() => { if (S.saveErr){ S.saveErr = false; schedule(); } })
    .catch(() => { S.saveErr = true; schedule(); });
}
function answer(qid, i){
  if (!S.state || S.state.status !== 'active') return;
  if (!S.mine || S.mine.sid !== S.state.sid) S.mine = { sid:S.state.sid, answers:{} };
  S.mine = { sid:S.mine.sid, answers:Object.assign({}, S.mine.answers, { [qid]: i }) };
  S.votes = Object.assign({}, S.votes, { [S.uid]: { sid:S.mine.sid, answers:S.mine.answers } });
  render(); saveMine();
}
function ensureJoined(){
  const st = S.state;
  if (!S.votesReady || !S.stateReady || !st || st.status !== 'active' || S.joinedSid === st.sid) return;
  if (S.isAdmin && S.tab !== 'participant') return;
  S.joinedSid = st.sid;
  const mv = S.votes[S.uid];
  if (mv && mv.sid === st.sid) S.mine = { sid:st.sid, answers:Object.assign({}, mv.answers) };
  else S.mine = { sid:st.sid, answers:{} };
}

/* ================= แอดมิน: ควบคุมกิจกรรม ================= */
async function adm(fn){
  S.adminErr = '';
  try { await fn(); } catch (e) { S.adminErr = 'ทำรายการไม่สำเร็จ ลองอีกครั้ง'; }
  render();
}
function startSession(title, auto){
  const qs = bankQs().filter(q => q.enabled !== false).map(q => ({ id:q.id, text:q.text, hint:q.hint || '', options:q.options, benchmark:q.benchmark || null }));
  if (!qs.length){ S.ui.startErr = 'เปิดใช้คำถามอย่างน้อย 1 ข้อในแท็บ “คำถาม” ก่อน'; render(); return; }
  S.ui.startErr = '';
  adm(() => S.db.doc('live/state').set({ sid:uidNew('s'), status:'lobby', title:title || 'Workshop', questions:qs, cur:0, revealed:{}, auto:!!auto }));
}
function buildArchive(){
  const st = S.state;
  return {
    sid:st.sid, title:st.title, startedAt:st.startedAt || null, endedAt:Date.now(), participants:cohort().filter(v => v.answers && Object.keys(v.answers).length > 0).length,
    questions: st.questions.map(q => { const counts = countsFor(q.id, q.options.length); return { id:q.id, text:q.text, options:q.options, benchmark:q.benchmark || null, counts, total:counts.reduce((a, b) => a + b, 0) }; })
  };
}
function endSession(){
  S.ui.confirmEnd = false;
  adm(async () => {
    const a = buildArchive();
    await S.db.doc('archive/' + a.sid).set(a);
    await S.db.doc('live/state').update({ status:'ended', endedAt:a.endedAt });
  });
}
function checkAuto(){
  const st = S.state;
  if (!S.isAdmin || !st || st.status !== 'active' || !st.auto || S.autoBusy) return;
  const q = st.questions[st.cur]; if (!q || (st.revealed && st.revealed[q.id])) return;
  const online = activeIds().size;
  if (online > 0 && answeredActive(q.id) >= online){
    S.autoBusy = true;
    S.db.doc('live/state').update({ revealed:{ [q.id]:true } }).catch(() => {}).then(() => { S.autoBusy = false; });
  }
}

/* ---------- QR เข้าร่วม ---------- */
function joinUrl(){
  if (S.ui.joinUrl) return S.ui.joinUrl;
  return /^https?:/.test(location.protocol) ? location.origin + location.pathname : location.href;
}
function qrSvg(text){
  const NS = 'http://www.w3.org/2000/svg', m = 4;
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), size = n + 2 * m;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
  svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'QR code สำหรับเข้าร่วมกิจกรรม'); svg.setAttribute('shape-rendering', 'crispEdges');
  const bg = document.createElementNS(NS, 'rect'); bg.setAttribute('width', size); bg.setAttribute('height', size); bg.setAttribute('fill', '#ffffff');
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', '#000000');
  svg.append(bg, p);
  return svg;
}
function qrNode(text){
  try { return qrSvg(text); } catch (e) { return h('p', { class:'err' }, 'สร้าง QR ไม่ได้ ลิงก์ยาวเกินไปหรือว่างอยู่'); }
}
const isLocalUrl = u => /^(https?:\/\/)?(localhost|127\.|0\.0\.0\.0|\[::1\])/i.test(u) || /^file:/i.test(u);
function joinCard(){
  const box = h('div', { class:'qrbox' });
  const warn = h('p', { class:'err small' }, '');
  const input = h('input', { type:'text', id:'join-url', value:joinUrl(), 'aria-label':'ลิงก์สำหรับผู้เข้าร่วม' });
  const draw = () => {
    const u = input.value.trim(); S.ui.joinUrl = u;
    box.replaceChildren(qrNode(u));
    warn.textContent = isLocalUrl(u) ? 'ลิงก์นี้เป็นเครื่องของคุณเอง (localhost) มือถือสแกนแล้วจะเข้าไม่ได้ ใช้ได้เมื่อขึ้นโฮสต์แล้ว หรือเปลี่ยนเป็น IP ของเครื่องที่อยู่ใน Wi-Fi เดียวกัน' : '';
  };
  input.addEventListener('input', draw); draw();
  const copy = h('button', { class:'btn sm', type:'button' }, 'คัดลอกลิงก์');
  copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(input.value.trim()); copy.textContent = 'คัดลอกแล้ว'; } catch (e) { copy.textContent = 'คัดลอกไม่ได้'; } setTimeout(() => { copy.textContent = 'คัดลอกลิงก์'; }, 1600); });
  return h('div', { class:'qrcard' },
    h('h2', null, 'ให้ผู้เข้าร่วมสแกน'),
    box,
    h('label', { class:'field', for:'join-url', style:'margin-top:14px' }, 'ลิงก์สำหรับผู้เข้าร่วม', input),
    warn,
    h('div', { class:'actions', style:'margin-top:8px' },
      h('button', { class:'btn sm', type:'button', on:{ click: () => { S.ui.qrFull = true; render(); } } }, 'แสดง QR เต็มจอสำหรับฉาย'), copy));
}

function qForm(q, idx, qs){
  const isNew = !q;
  const text = h('textarea', { id:'f-text' }, q ? q.text : '');
  const opts = h('textarea', { id:'f-opts', style:'min-height:130px' }, q ? q.options.map(o => o.label).join('\n') : '');
  const dir = h('select', { id:'f-dir' }, h('option', { value:'hot', selected: !q || q.dir !== 'cool' }, 'บนสุดเป็นสีร้อน ล่างสุดเป็นสีเย็น'), h('option', { value:'cool', selected: !!q && q.dir === 'cool' }, 'บนสุดเป็นสีเย็น ล่างสุดเป็นสีร้อน'));
  const bench = h('input', { type:'text', id:'f-bench', value: q && q.benchmark ? q.benchmark.join(', ') : '', placeholder:'เช่น 56, 20, 12, 7, 3, 2' });
  const ver = h('input', { type:'checkbox', id:'f-ver', checked: !!q && !q.draft });
  const en = h('input', { type:'checkbox', id:'f-en', checked: !q || q.enabled !== false });
  const err = h('p', { class:'err', 'aria-live':'polite' }, S.ui.formErr || '');
  const save = () => {
    const t = text.value.trim();
    const labels = opts.value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!t) return fail('กรอกคำถามก่อน');
    if (labels.length < 2 || labels.length > 8) return fail('ตัวเลือกต้องมี 2–8 ข้อ (หนึ่งข้อต่อหนึ่งบรรทัด)');
    if (new Set(labels).size !== labels.length) return fail('มีตัวเลือกซ้ำกัน');
    let b = null;
    if (bench.value.trim()){
      b = bench.value.split(/[,\s]+/).filter(Boolean).map(Number);
      if (b.length !== labels.length || b.some(x => !isFinite(x) || x < 0 || x > 100)) return fail('ค่าอ้างอิงทั่วโลกต้องมี ' + labels.length + ' ค่า (0–100) เท่ากับจำนวนตัวเลือก');
    }
    const heats = heatsFor(labels.length, dir.value);
    const item = { id: q ? q.id : uidNew('c'), text:t, hint:'เลือกข้อที่ตรงกับคุณที่สุด', dir:dir.value, enabled:en.checked, draft:!ver.checked, benchmark:b, options: labels.map((label, i) => ({ label, heat:heats[i] })) };
    const a = clone(qs); if (isNew) a.push(item); else a[idx] = item;
    saveBank(a);
  };
  function fail(m){ S.ui.formErr = m; err.textContent = m; }
  return h('div', { class:'qitem' },
    h('label', { class:'field', for:'f-text' }, 'คำถาม', text),
    h('label', { class:'field', for:'f-opts' }, 'ตัวเลือกคำตอบ', h('span', { class:'help' }, 'หนึ่งบรรทัดต่อหนึ่งตัวเลือก เรียงตามลำดับที่จะแสดง'), opts),
    h('label', { class:'field', for:'f-dir' }, 'การไล่สี', dir),
    h('label', { class:'field', for:'f-bench' }, 'ค่าอ้างอิงทั่วโลก (%) ไม่บังคับ', h('span', { class:'help' }, 'เรียงตามตัวเลือก คั่นด้วยจุลภาค ใช้ตัวเลขจากรายงานทางการเพื่อเปรียบเทียบ'), bench),
    h('label', { class:'check' }, ver, h('span', null, 'ตรวจถ้อยคำเทียบกับแบบสอบถามทางการแล้ว')),
    h('label', { class:'check' }, en, h('span', null, 'ใช้ในกิจกรรมรอบถัดไป')),
    err,
    h('div', { class:'actions' },
      h('button', { class:'btn primary', type:'button', on:{ click: save } }, isNew ? 'เพิ่มคำถาม' : 'บันทึก'),
      h('button', { class:'btn', type:'button', on:{ click: () => { S.ui.editId = null; S.ui.formErr = ''; render(); } } }, 'ยกเลิก')));
}

/* ================= แอดมิน: สถิติ ================= */
function csvFor(list){
  const esc = v => { let s = String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [['session_id','session_title','ended_at','question','option','count','percent','global_percent']];
  list.forEach(a => a.questions.forEach(q => q.options.forEach((o, i) => rows.push([a.sid, a.title, new Date(a.endedAt).toISOString(), q.text, o.label, q.counts[i], q.total ? Math.round(1000 * q.counts[i] / q.total) / 10 : 0, q.benchmark && typeof q.benchmark[i] === 'number' ? q.benchmark[i] : '']))));
  return '\uFEFF' + rows.map(r => r.map(esc).join(',')).join('\r\n');
}
async function dlCsv(list, name){
  S.ui.dlMsg = '';
  try {
    const url = URL.createObjectURL(new Blob([csvFor(list)], { type:'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch (e) { S.ui.dlMsg = 'ดาวน์โหลดไม่สำเร็จ'; }
  render();
}
function headline(q, counts){
  const total = counts.reduce((a, b) => a + b, 0); if (!total) return 'ยังไม่มีคำตอบ';
  const top = counts.indexOf(Math.max.apply(null, counts)), pct = Math.round(100 * counts[top] / total);
  let s = 'ส่วนใหญ่ตอบว่า “' + q.options[top].label + '” (' + pct + '%)';
  if (q.benchmark && typeof q.benchmark[top] === 'number') s += ' เทียบกับทั่วโลก ' + q.benchmark[top] + '%';
  return s;
}
function aggregate(){
  const map = new Map();
  S.archive.forEach(a => a.questions.forEach(q => {
    let m = map.get(q.id);
    if (!m){ m = { q, counts:new Array(q.options.length).fill(0), sessions:0 }; map.set(q.id, m); }
    if (m.counts.length === q.counts.length){ q.counts.forEach((c, i) => m.counts[i] += c); m.sessions++; }
  }));
  return [...map.values()];
}
function adminStats(){
  const frag = document.createDocumentFragment(), A = S.archive;
  frag.append(h('h1', null, 'สถิติทุกกิจกรรม'));
  if (!S.archiveReady) { frag.append(h('p', { class:'hint' }, 'กำลังโหลด…')); return frag; }
  if (!A.length){ frag.append(h('p', { class:'hint' }, 'ยังไม่มีกิจกรรมที่จบ เมื่อกดจบกิจกรรม ผลจะถูกเก็บไว้ที่นี่')); return frag; }
  const people = A.reduce((s, a) => s + (a.participants || 0), 0);
  frag.append(h('div', { class:'stat' }, h('div', null, h('span', { class:'big' }, A.length), h('small', null, 'กิจกรรม')), h('div', null, h('span', { class:'big' }, people), h('small', null, 'ผู้เข้าร่วมรวม'))));
  if (S.dl) frag.append(h('div', { class:'actions', style:'margin-top:12px' }, h('button', { class:'btn sm', type:'button', on:{ click: () => dlCsv(A, 'climate-voice-all.csv') } }, 'ดาวน์โหลด CSV ทุกกิจกรรม')));
  if (S.ui.dlMsg) frag.append(h('p', { class:'err' }, S.ui.dlMsg));

  frag.append(h('h2', null, 'ภาพรวมสะสม'));
  aggregate().forEach(m => {
    const total = m.counts.reduce((a, b) => a + b, 0);
    frag.append(h('div', { style:'margin-top:22px' },
      h('b', null, m.q.text),
      h('p', { class:'headline' }, headline(m.q, m.counts)),
      h('p', { class:'muted small', style:'margin:2px 0 0' }, 'จาก ' + total + ' คำตอบ ใน ' + m.sessions + ' กิจกรรม'),
      resultBlock(m.q, m.counts, { kind:'bars' })));
  });

  frag.append(h('h2', null, 'รายกิจกรรม'));
  A.forEach(a => {
    const open = S.ui.openArch === a.sid;
    const box = h('div', { class:'sess' },
      h('div', { class:'sesshead' },
        h('div', null, h('b', null, a.title), h('div', { class:'muted small' }, fmtDate(a.endedAt) + ' · ' + (a.participants || 0) + ' คน')),
        h('div', { class:'actions', style:'margin:0' },
          h('button', { class:'btn sm', type:'button', 'aria-expanded': open ? 'true' : 'false', on:{ click: () => { S.ui.openArch = open ? null : a.sid; render(); } } }, open ? 'ซ่อน' : 'ดูผล'),
          S.dl ? h('button', { class:'btn sm', type:'button', on:{ click: () => dlCsv([a], 'climate-voice-' + a.sid + '.csv') } }, 'CSV') : null,
          h('button', { class:'btn sm danger' + (S.ui.delA === a.sid ? ' sure' : ''), type:'button', on:{ click: () => { if (S.ui.delA === a.sid){ S.ui.delA = null; adm(() => S.db.doc('archive/' + a.sid).delete()); } else { S.ui.delA = a.sid; render(); } } } }, S.ui.delA === a.sid ? 'ยืนยันลบ' : 'ลบ'))));
    if (open) a.questions.forEach((q, i) => box.append(h('div', { style:'margin-top:18px' }, h('b', null, (i + 1) + '. ' + q.text), h('p', { class:'headline' }, headline(q, q.counts)), resultBlock(q, q.counts, { kind:'bars' }))));
    frag.append(box);
  });
  return frag;
}

/* ================= เมนู / สถานะ / render ================= */
const TABS = [['live','ควบคุมสด'],['bank','คำถาม'],['stats','สถิติ'],['participant','ดูแบบผู้เข้าร่วม']];
function renderNav(){
  $nav.hidden = !(S.isAdmin && S.mode === 'live');
  if ($nav.hidden) return;
  $nav.replaceChildren(...TABS.map(([k, label]) => h('button', { type:'button', 'aria-current': S.tab === k ? 'page' : null, on:{ click: () => { S.tab = k; S.ui.editId = null; S.ui.confirmEnd = false; S.ui.delQ = S.ui.delA = null; ensureJoined(); updatePresence(); render(); } } }, label)));
}
function renderStatus(){
  const on = S.mode === 'live';
  $status.className = 'status' + (on ? '' : ' off');
  $status.lastChild.textContent = on ? (S.isAdmin ? 'ผู้ดำเนินกิจกรรม ผลสด' : 'ผลสด') : (S.mode === 'loading' ? 'กำลังเชื่อมต่อ' : 'ไม่ได้เชื่อมต่อ');
}
function renderFoot(){
  const f = document.getElementById('foot-actions'); f.replaceChildren();
  if (S.mode !== 'live') return;
  f.append(S.anon
    ? h('button', { class:'btn sm', type:'button', on:{ click: () => { S.ui.login = true; render(); } } }, 'เข้าสู่ระบบผู้ดำเนินกิจกรรม')
    : h('button', { class:'btn sm', type:'button', on:{ click: logout } }, 'ออกจากระบบ'));
}
function render(){
  renderStatus(); renderNav(); renderFoot();
  if (S.ui.qrFull && S.isAdmin && S.mode === 'live'){ $nav.hidden = true; $app.replaceChildren(qrFullView()); return; }
  if (S.ui.login && S.mode === 'live'){ $nav.hidden = true; $app.replaceChildren(loginView()); return; }
  let v;
  if (S.mode === 'loading' || (S.mode === 'live' && !(S.stateReady && S.votesReady))) v = msgView('กำลังเชื่อมต่อ…');
  else if (S.mode !== 'live') v = S.errMsg === 'setup'
    ? msgView('ยังไม่ได้ตั้งค่า Firebase', 'เปิดไฟล์นี้ด้วยตัวแก้ไขข้อความ แล้วใส่ค่าใน FIREBASE_CONFIG ตอนต้นของสคริปต์ (ขั้นตอนอยู่ใน README)')
    : msgView('เข้าร่วมไม่ได้ในตอนนี้', S.errMsg || 'ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้านี้');
  else if (S.isAdmin && S.tab !== 'participant') v = S.tab === 'live' ? adminLive() : S.tab === 'bank' ? adminBank() : adminStats();
  else v = participantView();
  $app.replaceChildren(v);
}
let timer = null;
function schedule(){
  if (S.ui.login || (S.isAdmin && S.tab === 'bank')) return;
  const a = document.activeElement;
  if (a && $app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox'){ S.pending = true; return; }
  clearTimeout(timer); timer = setTimeout(render, 120);
}
$app.addEventListener('focusout', () => { if (S.pending){ S.pending = false; setTimeout(schedule, 250); } });
function afterData(){ ensureJoined(); updatePresence(); checkAuto(); schedule(); }

/* ================= เชื่อมต่อ Firebase Realtime Database ================= */
const arr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.keys(x).sort((a, b) => a - b).map(k => x[k]) : []);
function normQ(q){
  q = Object.assign({}, q); q.options = arr(q.options).filter(Boolean);
  if (q.benchmark) q.benchmark = arr(q.benchmark); else q.benchmark = null;
  if (q.counts) q.counts = arr(q.counts);
  return q;
}
const normState = d => d ? Object.assign({}, d, { questions: arr(d.questions).filter(Boolean).map(normQ), revealed: d.revealed || {} }) : null;

/* ตัวแปลงให้เรียกใช้รูปแบบเดียวกับโค้ดด้านบน (doc/collection/set/update/onSnapshot) */
function mkDb(rdb){
  const flat = (o, p, out) => { for (const k in o){ const v = o[k]; if (v && typeof v === 'object' && !Array.isArray(v)) flat(v, p + k + '/', out); else out[p + k] = v === undefined ? null : v; } return out; };
  const snapDoc = s => ({ id:s.key, exists:s.exists(), data:() => s.val() === null ? undefined : s.val() });
  const doc = path => ({
    set: d => rdb.ref(path).set(JSON.parse(JSON.stringify(d))),
    update: d => rdb.ref(path).update(flat(JSON.parse(JSON.stringify(d)), '', {})),
    delete: () => rdb.ref(path).remove(),
    onSnapshot: (next, err) => { const r = rdb.ref(path), cb = s => next(snapDoc(s)); r.on('value', cb, err); return () => r.off('value', cb); }
  });
  const coll = (path, ord) => ({
    orderBy: (f, dir) => coll(path, { f, dir }),
    onSnapshot: (next, err) => {
      const r = rdb.ref(path);
      const cb = s => {
        const docs = []; s.forEach(c => { docs.push(snapDoc(c)); });
        if (ord) docs.sort((a, b) => { const x = (a.data() || {})[ord.f], y = (b.data() || {})[ord.f]; return (ord.dir === 'desc' ? -1 : 1) * ((x > y) - (x < y)); });
        next({ docs });
      };
      r.on('value', cb, err); return () => r.off('value', cb);
    }
  });
  return { doc, collection: p => coll(p) };
}

function logout(){ firebase.auth().signOut().then(() => location.reload()); }
function loginView(){
  const em = h('input', { type:'email', id:'l-email', autocomplete:'username' });
  const pw = h('input', { type:'password', id:'l-pw', autocomplete:'current-password' });
  const err = h('p', { class:'err', 'aria-live':'polite' }, '');
  const go = async () => {
    err.textContent = '';
    try { await firebase.auth().signInWithEmailAndPassword(em.value.trim(), pw.value); location.reload(); }
    catch (e) { err.textContent = 'เข้าสู่ระบบไม่สำเร็จ ตรวจอีเมลและรหัสผ่าน'; }
  };
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  return h('div', null,
    h('h1', null, 'เข้าสู่ระบบผู้ดำเนินกิจกรรม'),
    h('p', { class:'hint' }, 'ใช้อีเมลและรหัสผ่านที่สร้างไว้ใน Firebase เท่านั้น ผู้เข้าร่วมไม่ต้องเข้าสู่ระบบ'),
    h('label', { class:'field', for:'l-email' }, 'อีเมล', em),
    h('label', { class:'field', for:'l-pw' }, 'รหัสผ่าน', pw),
    err,
    h('div', { class:'actions' },
      h('button', { class:'btn primary', type:'button', on:{ click: go } }, 'เข้าสู่ระบบ'),
      h('button', { class:'btn', type:'button', on:{ click: () => { S.ui.login = false; render(); } } }, 'ยกเลิก')));
}

function boot(){
  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.databaseURL){ S.mode = 'nodb'; S.errMsg = 'setup'; return; }
  if (typeof firebase === 'undefined'){ S.mode = 'error'; S.errMsg = 'โหลด Firebase ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วรีเฟรช'; return; }
  try { firebase.initializeApp(FIREBASE_CONFIG); } catch (e) { S.mode = 'error'; S.errMsg = 'ค่า FIREBASE_CONFIG ไม่ถูกต้อง'; return; }
  const auth = firebase.auth(), rdb = firebase.database();
  let started = false;
  auth.onAuthStateChanged(async u => {
    if (started) return;
    if (!u){
      try { await auth.signInAnonymously(); }
      catch (e) { S.mode = 'error'; S.errMsg = 'เปิด Anonymous sign-in ใน Firebase Authentication ก่อน'; render(); }
      return;
    }
    started = true;
    S.uid = u.uid; S.anon = u.isAnonymous; S.dl = true;
    const db = S.db = mkDb(rdb); S.rdb = rdb;
    if (!u.isAnonymous){
      try { S.isAdmin = (await rdb.ref('admins/' + u.uid).once('value')).val() === true; } catch (e) { S.isAdmin = false; }
    }
    S.mode = 'live';
    const fail = () => { S.mode = 'error'; S.errMsg = 'อ่านข้อมูลไม่ได้ ตรวจกติกา (rules) ของฐานข้อมูล'; render(); };
    db.doc('live/state').onSnapshot(s => { S.state = s.exists ? normState(s.data()) : null; S.stateReady = true; afterData(); }, fail);
    db.collection('votes').onSnapshot(snap => {
      const m = {}; snap.docs.forEach(x => { const d = x.data(); if (d) m[x.id] = Object.assign({}, d, { answers: d.answers || {} }); });
      S.votes = m; S.votesReady = true; afterData();
    }, fail);
    rdb.ref('.info/serverTimeOffset').on('value', x => { S.offset = x.val() || 0; });
    let wasConn = false;
    rdb.ref('.info/connected').on('value', x => { const c = x.val() === true; if (c && !wasConn && P.on){ P.key = null; rdb.ref('presence/' + S.uid).onDisconnect().remove(); updatePresence(); } wasConn = c; });
    db.collection('presence').onSnapshot(snap => {
      const m = {}; snap.docs.forEach(x => { const d = x.data(); if (d) m[x.id] = d; });
      S.presence = m; schedule();
    }, () => {});
    setInterval(() => { if (S.mode === 'live'){ checkAuto(); schedule(); } }, 10000);
    if (S.isAdmin){
      db.doc('live/bank').onSnapshot(s => {
        const d = s.exists ? s.data() : null;
        S.bank = d && d.questions ? arr(d.questions).filter(Boolean).map(normQ) : null;
        if (!(S.tab === 'bank' && S.ui.editId)) render();
      }, () => {});
      db.collection('archive').orderBy('endedAt', 'desc').onSnapshot(snap => {
        S.archive = snap.docs.map(x => x.data()).filter(Boolean).map(a => Object.assign({}, a, { questions: arr(a.questions).filter(Boolean).map(normQ) }));
        S.archiveReady = true; if (S.tab === 'stats') schedule();
      }, () => { S.archiveReady = true; });
    }
    render();
  });
}
boot();
render();
</script>
